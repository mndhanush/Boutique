<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr" class="scroll-smooth dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>404 Not Found | Bloom</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#000000',   
                        secondary: '#EC4899', 
                        cream: '#F9F6F0',     
                        accent: '#111111',    
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'], 
                    },
                    animation: {
                        'gradient-x': 'gradient-x 3s ease infinite',
                        'fadeInUp': 'fadeInUp 0.6s ease-out forwards',
                    },
                    keyframes: {
                        'gradient-x': {
                            '0%, 100%': { 'background-size': '200% 200%', 'background-position': 'left center' },
                            '50%': { 'background-size': '200% 200%', 'background-position': 'right center' },
                        },
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        :root {
            --bg-color: #FFFFFF; 
            --text-main: #666666; 
            --text-heading: #000000; 
            --border-color: #E5E5E5; 
        }
        
        [data-theme="dark"] {
            --bg-color: #050505; 
            --text-main: #AAAAAA; 
            --text-heading: #FFFFFF; 
            --border-color: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: background-color 0.3s ease, color 0.3s ease;
            font-family: 'Inter', sans-serif;
            font-weight: 400;
        }

        .nav-icon-btn { 
            border: 1px solid var(--border-color);
            color: var(--text-heading);
            background: transparent;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .nav-icon-btn:hover {
            border-color: var(--text-heading);
            background: rgba(212, 175, 55, 0.1);
            color: var(--text-heading);
        }

        .gold-gradient-text {
            background: linear-gradient(to right, #EC4899, #F9A8D4, #DB2777, #FBCFE8, #BE185D);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            background-size: 200% auto;
        }

        /* Utility to temporarily disable transitions during RTL switch */
        .no-transition * {
            transition: none !important;
        }
    </style>
    <link rel="icon" type="image/jpeg" href="assets/images/favicon1.jpg">
</head>
<body class="h-screen flex items-center justify-center relative overflow-hidden dark">

    <!-- Controls -->
    <div class="absolute top-6 right-6 md:top-10 md:right-10 flex items-center gap-3 z-[100] rtl:left-6 rtl:right-auto md:rtl:left-10 md:rtl:right-auto">
        <button type="button" class="rtl-toggle-btn nav-icon-btn rounded-full text-[10px] uppercase tracking-widest font-bold" title="Toggle RTL">
            RTL
        </button>
        <button type="button" class="theme-toggle nav-icon-btn rounded-full" title="Toggle Theme">
            <i class="fas fa-moon text-sm hidden dark:inline-block"></i>
            <i class="fas fa-sun text-sm dark:hidden"></i>
        </button>
    </div>

    <!-- Luxury Ambient Glows -->
    <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-secondary/10 rounded-full blur-[100px] animate-pulse z-0 pointer-events-none"></div>
    <div class="absolute bottom-1/4 right-1/4 w-[500px] h-[500px] bg-white/5 dark:bg-white/5 rounded-full blur-[120px] animate-pulse z-0 pointer-events-none" style="animation-delay: 2s;"></div>

    <!-- Main 404 Content -->
    <div class="container mx-auto px-4 text-center z-10 opacity-0 animate-[fadeInUp_0.8s_ease-out_forwards]">
        
        <div class="inline-flex items-center gap-3 px-5 py-2 rounded-sm border border-secondary bg-secondary/5 font-bold tracking-[0.2em] uppercase text-[10px] mb-8" style="color: var(--text-heading);">
            <span class="w-1.5 h-1.5 rounded-full bg-secondary animate-ping"></span>
            Error 404
        </div>
        
        <h1 class="font-serif text-[120px] md:text-[200px] font-bold gold-gradient-text animate-gradient-x leading-none mb-4 drop-shadow-2xl tracking-tighter">
            404
        </h1>
        
        <h2 class="font-serif text-3xl md:text-5xl font-bold mb-6 leading-tight tracking-wide" style="color: var(--text-heading);">
            Out of Bounds!
        </h2>
        
        <p class="text-sm md:text-base max-w-lg mx-auto font-light mb-12 leading-relaxed tracking-wide" style="color: var(--text-main);">
            Looks like you've jumped a little too high! The page you are looking for has bounced away, changed its name, or is temporarily unavailable.
        </p>

        <a href="index.html" class="inline-flex items-center justify-center gap-3 bg-secondary text-black px-10 py-4 rounded-sm font-bold text-xs uppercase tracking-widest hover:bg-white transition-all duration-300 transform hover:-translate-y-1 shadow-xl border border-secondary">
            <i class="fas fa-home"></i> Return to Home
        </a>
    </div>

    <script>
        // --- Standard Theme Toggle Logic ---
        const htmlElement = document.documentElement;
        const themeToggleBtns = document.querySelectorAll('.theme-toggle');

        function updateTheme() {
            const isDark = htmlElement.classList.contains('dark');
            htmlElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            themeToggleBtns.forEach(btn => {
                const moonIcon = btn.querySelector('.fa-moon');
                const sunIcon = btn.querySelector('.fa-sun');
                if (isDark) {
                    if(moonIcon) moonIcon.classList.remove('hidden');
                    if(sunIcon) sunIcon.classList.add('hidden');
                } else {
                    if(moonIcon) moonIcon.classList.add('hidden');
                    if(sunIcon) sunIcon.classList.remove('hidden');
                }
            });
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        themeToggleBtns.forEach(btn => {
            if(btn) {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation(); 
                    htmlElement.classList.toggle('dark');
                    updateTheme();
                });
            }
        });

        // Initialize Theme
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
        } else {
            htmlElement.classList.remove('dark');
        }
        updateTheme();

        // --- Standard RTL Toggle Logic ---
        const rtlToggleBtns = document.querySelectorAll('.rtl-toggle-btn');
        
        rtlToggleBtns.forEach(btn => {
            if(btn) {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation(); 
                    
                    document.body.classList.add('no-transition');
                    
                    const currentDir = htmlElement.getAttribute('dir');
                    htmlElement.setAttribute('dir', currentDir === 'ltr' ? 'rtl' : 'ltr');
                    
                    setTimeout(() => {
                        document.body.classList.remove('no-transition');
                    }, 50);
                });
            }
        });

        // Initialize RTL
        if (localStorage.getItem('direction') === 'rtl') {
            htmlElement.setAttribute('dir', 'rtl');
        }
    </script>
</body>
</html>
