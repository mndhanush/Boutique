<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Log in to your secure Bloom vault.">
    <title>Login | Bloom</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#000000',   
                        secondary: '#EC4899', 
                        cream: '#F9F6F0',     
                        accent: '#111111',    
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'], 
                    },
                    screens: {
                        'xs': '360px', 'sm': '390px', 'md': '768px', 
                        'lg': '1024px', 'xl': '1280px', '2xl': '1536px', 
                    }
                }
            }
        }
    </script>
    
    <style>
        :root {
            --bg-color: #FFFFFF;
            --text-color: #000000;
            --text-muted: #666666;
            --card-bg: #FFFFFF;
            --border-color: #E5E5E5;
            --nav-bg: rgba(255, 255, 255, 0.95);
            --hover-highlight: #D4AF37;
        }
        
        [data-theme="dark"] {
            --bg-color: #050505;
            --text-color: #FFFFFF;
            --text-muted: #AAAAAA;
            --card-bg: #111111;
            --border-color: #333333;
            --nav-bg: rgba(5, 5, 5, 0.95);
            --hover-highlight: #D4AF37;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow-x: hidden;
            font-weight: 400; 
        }

        /* Utility to temporarily disable transitions during RTL switch */
        .no-transition * {
            transition: none !important;
        }

        .text-body-muted { color: var(--text-muted); transition: color 0.3s ease; }
        .bg-card { background-color: var(--card-bg); border-color: var(--border-color); }
        .border-theme { border-color: var(--border-color); }

        /* Clean Navbar */
        .glass-nav {
            background: var(--nav-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
        }

        /* Utilities */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 0px; }
        ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }
        
        .utility-btn {
            display: flex; align-items: center; justify-content: center;
            width: 36px; height: 36px; border-radius: 2px;
            border: 1px solid var(--border-color); background: transparent;
            color: var(--text-color); font-weight: 600; transition: all 0.3s ease; cursor: pointer;
        }
        .utility-btn:hover { border-color: var(--hover-highlight); color: #000; background: var(--hover-highlight); }

        /* Gold Checkbox */
        input[type="checkbox"] {
            accent-color: var(--text-heading);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeInUp 0.8s ease-out;
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body class="antialiased font-normal h-screen overflow-hidden flex flex-col dark">

    <!-- Top Right Utilities -->
    <div class="absolute top-4 end-4 flex items-center gap-3 z-50">
        <button type="button" class="rtl-toggle-btn utility-btn text-[10px] uppercase tracking-widest font-bold" title="Toggle RTL">
            RTL
        </button>
        <button type="button" class="theme-toggle utility-btn" title="Toggle Theme">
            <i class="fas fa-moon text-sm hidden dark:inline-block"></i>
            <i class="fas fa-sun text-sm dark:hidden"></i>
        </button>
    </div>
    

    

    <!-- Luxury Ambient Glows -->
    <div class="absolute top-20 start-10 w-96 h-96 bg-secondary/10 rounded-full blur-[100px] animate-pulse pointer-events-none z-0"></div>
    <div class="absolute bottom-10 end-10 w-[500px] h-[500px] bg-white/5 dark:bg-white/5 rounded-full blur-[120px] animate-pulse pointer-events-none z-0" style="animation-delay: 2s;"></div>

    <!-- Main Content Area: Login Form -->
    <div class="flex-1 overflow-y-auto flex items-center justify-center p-4 pt-20 relative z-10">
        <div class="w-full max-w-[400px] bg-card border border-theme shadow-2xl p-8 md:p-10 animate-fade-in group rounded-sm relative overflow-hidden z-10">
            
            <!-- Top Gold Accent Line -->
            <div class="absolute top-0 start-0 w-full h-1 bg-secondary"></div>

            
        <div class="flex justify-center mb-6">
            <a href="index.html" class="flex items-center gap-2 group transition-transform duration-300 hover:scale-105">
                <i class="fas fa-seedling text-secondary text-2xl"></i>
                <div class="text-2xl font-serif font-bold text-[var(--text-color)] tracking-wider uppercase">Bloom</div>
            </a>
        </div>
    
            <div class="text-center mb-8">
                <h2 class="font-serif text-2xl font-bold text-[var(--text-color)] mb-2">Welcome Back</h2>
                <p class="text-xs uppercase tracking-widest text-[var(--text-muted)]">Sign in to your private vault</p>
                <div class="h-px w-10 bg-secondary mx-auto mt-4"></div>
            </div>

            <form class="flex flex-col gap-5" onsubmit="handleLogin(event)">

                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-[var(--text-color)] mb-2">
                        Email Address
                    </label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute start-4 top-1/2 -translate-y-1/2 text-[var(--text-muted)] text-xs"></i>
                        <input 
                            type="email" 
                            required
                            placeholder="CLIENT@LUXETIME.COM"
                            class="w-full ps-10 pe-4 py-3 bg-[var(--bg-color)] border border-theme text-[var(--text-color)] text-xs uppercase tracking-widest focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary rounded-sm transition-all"
                        />
                    </div>
                </div>

                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-[var(--text-color)] mb-2">
                        Password
                    </label>
                    <div class="relative">
                        <i class="fas fa-lock absolute start-4 top-1/2 -translate-y-1/2 text-[var(--text-muted)] text-xs"></i>
                        <input 
                            type="password" 
                            id="password"
                            required
                            placeholder="ENTER PASSWORD"
                            class="w-full ps-10 pe-10 py-3 bg-[var(--bg-color)] border border-theme text-[var(--text-color)] text-xs uppercase tracking-widest focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary rounded-sm transition-all"
                        />
                        <button 
                            type="button" 
                            onclick="togglePassword()"
                            class="absolute end-4 top-1/2 -translate-y-1/2 text-[var(--text-muted)] hover:text-secondary transition-colors"
                        >
                            <i class="fas fa-eye text-xs" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <div class="flex items-center justify-between text-[10px] sm:text-[11px] pt-1">
                    <label class="flex items-center cursor-pointer group-checkbox">
                        <input type="checkbox" class="w-3.5 h-3.5 border-theme bg-transparent">
                        <span class="ms-2 text-body-muted font-medium uppercase tracking-widest">Remember me</span>
                    </label>
                    <span class="text-secondary font-bold uppercase tracking-widest cursor-pointer hover:underline transition-all">
                        Forgot password?
                    </span>
                </div>

                <button 
                    type="submit"
                    class="w-full py-4 mt-2 bg-secondary text-black hover:bg-white font-bold uppercase tracking-widest text-xs transition-all duration-300 flex items-center justify-center gap-3 rounded-sm shadow-lg border border-secondary"
                >
                    <span>Secure Login</span>
                </button>

                <div class="relative my-6">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-theme"></div>
                    </div>
                    <div class="relative flex justify-center text-[10px] uppercase tracking-widest font-bold">
                        <span class="px-4 bg-card text-[var(--text-muted)]">Or Authenticate With</span>
                    </div>
                </div>

                <div class="flex gap-3 w-full">
                    <button 
                        type="button"
                        class="flex items-center justify-center w-full py-3 border border-theme hover:border-secondary hover:bg-secondary/5 transition-all bg-[var(--bg-color)] rounded-sm shadow-sm"
                        title="Sign in with Google"
                    >
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-4 h-4" alt="Google">
                    </button>

                    <button 
                        type="button"
                        class="flex items-center justify-center w-full py-3 border border-theme hover:border-secondary hover:bg-secondary/5 transition-all bg-[var(--bg-color)] rounded-sm shadow-sm"
                        title="Sign in with Apple"
                    >
                        <i class="fab fa-apple text-lg text-[var(--text-color)]"></i>
                    </button>

                    <button 
                        type="button"
                        class="flex items-center justify-center w-full py-3 border border-theme hover:border-secondary hover:bg-secondary/5 transition-all bg-[var(--bg-color)] rounded-sm shadow-sm"
                        title="Sign in with Facebook"
                    >
                        <i class="fab fa-facebook text-[#1877F2] text-lg"></i>
                    </button>
                </div>

            </form>

            <div class="mt-8 text-center text-[10px] sm:text-xs font-medium uppercase tracking-widest text-body-muted">
                No Account? 
                <a href="register.html" class="text-secondary hover:text-[var(--text-color)] transition-colors ms-1 font-bold hover:underline">
                    Register Here
                </a>
            </div>

        </div>
    </div>

    <script>
        // --- Password Visibility Toggle ---
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // --- Handle Login Submission ---
        function handleLogin(event) {
            event.preventDefault();

            const button = event.target.querySelector('button[type="submit"]');
            const span = button.querySelector('span');
            
            const originalText = span.innerText;
            button.innerHTML = '<i class="fas fa-spinner fa-spin mr-2 text-sm"></i><span class="font-bold uppercase tracking-widest text-xs">Authenticating...</span>';
            button.disabled = true;
            button.classList.add('opacity-80', 'cursor-not-allowed');

            setTimeout(() => {
                window.location.href = 'index.html'; // Redirect to home
            }, 1500);
        }

        // --- Standard Theme Toggle Logic ---
        const htmlElement = document.documentElement;
        const themeToggleBtns = document.querySelectorAll('.theme-toggle');

        function updateTheme() {
            const isDark = htmlElement.classList.contains('dark');
            htmlElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            themeToggleBtns.forEach(btn => {
                const moonIcon = btn.querySelector('.fa-moon');
                const sunIcon = btn.querySelector('.fa-sun');
                if (isDark) {
                    if(moonIcon) moonIcon.classList.remove('hidden');
                    if(sunIcon) sunIcon.classList.add('hidden');
                } else {
                    if(moonIcon) moonIcon.classList.add('hidden');
                    if(sunIcon) sunIcon.classList.remove('hidden');
                }
            });
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        themeToggleBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault(); e.stopPropagation(); 
                htmlElement.classList.toggle('dark');
                updateTheme();
            });
        });

        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            htmlElement.classList.add('dark');
        } else {
            htmlElement.classList.remove('dark');
        }
        updateTheme();

        // --- Standard RTL Toggle Logic ---
        const rtlToggleBtns = document.querySelectorAll('.rtl-toggle-btn');
        rtlToggleBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.preventDefault();
                e.stopPropagation(); 
                
                document.body.classList.add('no-transition');
                
                const currentDir = htmlElement.getAttribute('dir');
                htmlElement.setAttribute('dir', currentDir === 'ltr' ? 'rtl' : 'ltr');
                
                setTimeout(() => {
                    document.body.classList.remove('no-transition');
                }, 50);
            });
        });

        if (localStorage.getItem('direction') === 'rtl') {
            htmlElement.setAttribute('dir', 'rtl');
        }

        // --- Navbar Scroll Effect ---
        window.addEventListener('scroll', () => {
            const nav = document.querySelector('nav');
            if (window.scrollY > 10) {
                nav.classList.add('shadow-md');
                nav.style.background = 'var(--bg-color)'; 
            } else {
                nav.classList.remove('shadow-md');
                nav.style.background = 'var(--nav-bg)';
            }
        });
    </script>
</body>
</html>
